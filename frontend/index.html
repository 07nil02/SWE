<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✦</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VELOCE FLEET — Curated Automotive Rental & Operational Registry</title>

    <!-- Google Fonts: Playfair Display (Editorial Serif), Inter (Clean Sans-Serif), JetBrains Mono (Specs & Rates) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&display=swap" rel="stylesheet">

    <!-- Tailwind CDN with refined automotive color tokens -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              serif: ['"Playfair Display"', 'Georgia', 'serif'],
              sans: ['Inter', 'system-ui', 'sans-serif'],
              mono: ['"JetBrains Mono"', 'monospace'],
            },
            colors: {
              charcoal: {
                950: '#090a0b',
                900: '#111215',
                850: '#17191d',
                800: '#1f2127',
                700: '#2b2e36',
                600: '#3e424d',
                500: '#5a5f6e',
                400: '#7c8394',
                300: '#a3a9ba',
                200: '#cdd1dd',
                100: '#e9ebf0',
              },
              champagne: {
                300: '#dfc7a7',
                400: '#c5a880',
                500: '#b89668',
                600: '#9d7c50',
                700: '#7d613c',
              },
              stone: {
                50: '#faf9f6',
                100: '#f4f2ed',
                200: '#eae6dd',
                300: '#d7d2c6',
              }
            },
            letterSpacing: {
              'luxury': '0.2em',
              'editorial': '0.28em',
            },
          }
        }
      }
    </script>
    <style>
      body {
        font-family: 'Inter', sans-serif;
        background-color: #faf9f6;
        color: #111215;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      /* Custom refined scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #f4f2ed;
      }
      ::-webkit-scrollbar-thumb {
        background: #c5a880;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #9d7c50;
      }

      /* Subtle image zoom transition */
      .editorial-card:hover .editorial-image {
        transform: scale(1.03);
      }
    </style>
  </head>
  <body class="bg-stone-50 text-charcoal-900 selection:bg-champagne-400/30 selection:text-charcoal-950 min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
